; ============================================================================
; 循迹主控固件（模块二）—— ESP32-S3
; ============================================================================
; 编译：pio run -e esp32-s3-devkitc-1
; 烧录：pio run -e esp32-s3-devkitc-1 -t upload
; 控制台：原生 USB-Serial/JTAG @921600
;
; ★ 关键：必须保留 -DARDUINO_USB_CDC_ON_BOOT=1
;   esp32-s3-devkitc-1 的 extra_flags 里只有 -DARDUINO_USB_MODE=1，
;   没有 -DARDUINO_USB_CDC_ON_BOOT；而 Arduino-ESP32 内核里该宏默认 0
;   （cores/esp32/HardwareSerial.h）⇒ `Serial` 实际指向 UART0（GPIO43/44）。
;   这块板子上没有 UART 桥芯片，UART0 没引到 USB 口 ⇒ 电脑上一个字节都收不到
;   （表现为"固件在跑但完全没输出"）。加上这个宏之后 `Serial` = HWCDC。
;
;   附带好处：不加这个宏时往 USB-CDC 写数据若无人消费，主机侧 write 会无限阻塞，
;   表现为"串口工具被挂死"。
;
; ⚠ PlatformIO 里 [env:xxx] 的 build_flags 是【覆盖】而不是追加 [env] 的同名项，
;   所以下面每个 env 都必须把 -DARDUINO_USB_CDC_ON_BOOT=1 再写一遍。
; ============================================================================

; ---------------- 公共设置 ----------------
[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
; 台架探针放在 src/scan/ 下，正式固件一律排除它（否则 setup/loop 重复定义）
build_src_filter = +<*> -<scan/>
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------- 正式固件 ----------------
[env:esp32-s3-devkitc-1]

; ---------------- 诊断：额外打印 I2C 探测原始返回码 ----------------
; -DDBG_IMU 打开后 setup() 会打印每步探测的 endTransmission() 码
; （0=ACK / 2=地址 NACK / 5=超时），并等主机发一个字节再继续（保证抓到开机日志）。
[env:s3-usbdbg]
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DDBG_IMU=1

; ---------------- 诊断：I2C 总线扫描探针 ----------------
; 用途：确认 IMU 挂在哪对引脚、哪个地址（换硬件或怀疑 I2C 不通时用）
; 用法：pio run -e s3-i2cscan -t upload
[env:s3-i2cscan]
build_src_filter = +<scan/i2c_scan.cpp>
