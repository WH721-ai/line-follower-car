; ============================================================================
; 双驱电机控制固件（模块一）—— 电机主控板 ESP32
; ============================================================================
; 板子：ESP32（通用 esp32dev / StackForce 电机主控）
; 依赖：SimpleFOC 已随仓库内置于 lib/SimpleFOC（MIT），不额外联网下载
; 引脚：见 include/Pins_Specify.h
;
; 编译：pio run -e esp32dev
; 烧录：pio run -e esp32dev -t upload
; 串口：115200（USB 调试口）
;
; 版本钉死 espressif32@7.0.1 / Arduino core 2.0.17 —— 这是拿 92.5 分的固件
; 实际使用的组合。换平台版本会改变 LEDC / ADC 行为，可能导致标定失效。
; ============================================================================

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
